<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>67 Arcade</title>
  <meta name="description" content="A little collection of games.">
  <meta name="theme-color" content="#141f23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="67 Arcade">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #141f23;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 32px) 16px calc(env(safe-area-inset-bottom) + 32px);
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    header img { width: 48px; height: 48px; border-radius: 12px; }
    h1 { font-size: 32px; font-weight: 900; letter-spacing: -0.5px; }
    .sub { font-size: 14px; color: #ffb020; font-weight: 700; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .game {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
    }

    .game img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 22%;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.12s;
    }

    .game:active img { transform: scale(0.94); }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="icons/icon-192.png" alt="">
      <div>
        <h1>67 Arcade</h1>
        <p class="sub">Pick a game</p>
      </div>
    </header>

    <!-- Add new games here; they fill in left to right, top to bottom. -->
    <nav class="grid">
      <a class="game" href="stacky/">
        <img src="stacky/thumb.png" alt="">
        <span>Stacky</span>
      </a>
      <a class="game" href="physics/">
        <img src="physics/thumb.png" alt="">
        <span>Physics</span>
      </a>
    </nav>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
