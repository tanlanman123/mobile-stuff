vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">
<meta name=\"apple-mobile-web-app-title\" content=\"67 Arcade\">
<link rel=\"manifest\" href=\"../manifest.json\">
<style>
#home { position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 12px; z-index: 10; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 24px; text-decoration: none; font-family: sans-serif; }
</style>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const home = document.createElement('a');
  home.id = 'home';
  home.href = '../';
  home.setAttribute('aria-label', 'Back to games');
  home.textContent = '\\u2190';
  document.body.append(home);
});
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('../sw.js', { scope: '../' }));
}
</script>"
html/canvas_resize_policy=2
